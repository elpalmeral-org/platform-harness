# Publica/actualiza los roles de uhp/roles.yaml como meridian/<rol> en HarnessRouter (F4.7,
# ADR 0033). Manual a propósito (workflow_dispatch): publicar en HarnessRouter cuesta dinero real
# (la primera llamada de cada rol, cuando se invoque de verdad) y usa una clave con presupuesto de
# 10 $ sin recarga — nunca atado al pipeline automático de release.
#
# Idempotente: el "name" de un harness no es buscable por el servidor (confirmado contra la API
# real), así que cada rol se busca por nombre en el listado completo antes de decidir si crear
# (POST) o actualizar (PUT) — nunca se crea un duplicado por relanzar este workflow.
name: harness-sync

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  harness-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publicar cada rol de uhp/roles.yaml
        env:
          HARNESSROUTER_API_KEY: ${{ secrets.HARNESSROUTER_API_KEY }}
          HR_URL: https://uhp.apl.elpalmeral.es/api/harness/v1
        run: |
          set -euo pipefail

          echo "GET /harnesses (listado para buscar por name)"
          status=$(curl -s -o /tmp/existing.json -w '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer $HARNESSROUTER_API_KEY" \
            "$HR_URL/harnesses")
          if [ "$status" != "200" ]; then
            echo "::error::GET /harnesses devolvió HTTP $status, no 200. Revisa HARNESSROUTER_API_KEY."
            cat /tmp/existing.json
            exit 1
          fi

          yq -o=json '.roles' uhp/roles.yaml > /tmp/roles.json
          for role in $(jq -r 'keys[]' /tmp/roles.json); do
            echo "=== $role ==="
            name="meridian/$role"
            base=$(jq -r --arg r "$role" '.[$r].base' /tmp/roles.json)
            model=$(jq -r --arg r "$role" '.[$r].model' /tmp/roles.json)
            disabled=$(jq -c --arg r "$role" '.[$r].disabledTools // []' /tmp/roles.json)

            jq -n \
              --arg name "$name" \
              --arg base "$base" \
              --arg model "$model" \
              --argjson disabled "$disabled" \
              --rawfile prompt ".apm/agents/$role.agent.md" \
              '{name: $name, base: $base, default_model: $model, system_prompt: $prompt, disabled_tools: $disabled}' \
              > /tmp/body.json

            existing_id=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' /tmp/existing.json | head -1)

            if [ -n "$existing_id" ]; then
              echo "ya existe ($existing_id) -> PUT"
              status=$(curl -s -o /tmp/result.json -w '%{http_code}' --max-time 20 -X PUT \
                -H "Authorization: Bearer $HARNESSROUTER_API_KEY" -H "Content-Type: application/json" \
                --data @/tmp/body.json "$HR_URL/harnesses/$existing_id")
            else
              echo "no existe -> POST"
              status=$(curl -s -o /tmp/result.json -w '%{http_code}' --max-time 20 -X POST \
                -H "Authorization: Bearer $HARNESSROUTER_API_KEY" -H "Content-Type: application/json" \
                --data @/tmp/body.json "$HR_URL/harnesses")
            fi

            if [ "$status" != "200" ]; then
              echo "::error::$name: HTTP $status"
              cat /tmp/result.json
              exit 1
            fi
            echo "$name -> $(jq -r '.id' /tmp/result.json)"
          done
